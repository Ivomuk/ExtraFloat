[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "End-to-end credit risk pipeline: PD model (XGBoost/LightGBM) → mobile money float limit engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "joblib",
    "tqdm",
]

[project.optional-dependencies]
shap    = ["shap"]
monitor = ["scipy>=1.11"]
dev     = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
credit-risk-pipeline = "run_credit_risk_pipeline:main"
pd-model-train       = "pd_model.run_pipeline:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["pd_model*", "extrafloat*"]

[tool.pytest.ini_options]
testpaths = ["tests", "pd_model/tests"]
